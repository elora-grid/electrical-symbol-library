name: Publish versioned library release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check version tag
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)process.exit(1)'
      - name: Package checked distribution
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf "dist/electrical-symbol-library-${GITHUB_REF_NAME}.tar.gz" .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "Elora Grid Open Electrical Symbol Library ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
